name: Accepted MIUIX source
description: Checkout and verify the pinned MIUIX graph shared by OS3 and OS4 variants.
runs:
  using: composite
  steps:
    - name: Checkout exact accepted MIUIX source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: compose-miuix-ui/miuix
        ref: b9f70838509fbc3f63f1a972777a7e6ce07f578f
        path: miuix-upstream
        persist-credentials: false
    - name: Verify exact source revision and dialog dependencies
      shell: bash
      run: |
        set -euo pipefail
        expected="$(sed -n 's/^miuix.upstream.revision=//p' gradle.properties)"
        actual="$(git -C miuix-upstream rev-parse HEAD)"
        test -n "$expected" && test "$actual" = "$expected"
        test -f miuix-upstream/miuix-ui/build.gradle.kts
        test -f miuix-upstream/miuix-blur/build.gradle.kts
        test -f app/src/os4Upstream/kotlin/top/yukonga/miuix/kmp/glass/GlassDialog.kt
        test -f app/src/os4Upstream/kotlin/top/yukonga/miuix/kmp/glass/internal/ScrimBackdrop.kt
        echo "MIUIX_SOURCE_REVISION=$expected" >> "$GITHUB_ENV"
        echo "MIUIX_SOURCE_DIR=miuix-upstream" >> "$GITHUB_ENV"

    # Keep the reviewed OS4 implementation pinned; align only the AGP version
    # catalog used by both the upstream modules and their included build-logic.
    - name: Align pinned MIUIX build-tool AGP version
      shell: bash
      run: |
        set -euo pipefail
        catalog="miuix-upstream/gradle/libs.versions.toml"
        expected="$(sed -n 's/^miuix.upstream.revision=//p' gradle.properties)"
        test "$(git -C miuix-upstream rev-parse HEAD)" = "$expected"
        git -C miuix-upstream diff --quiet
        app_agp="$(sed -nE 's/^[[:space:]]*id\("com\.android\.application"\) version "([^"]+)" apply false[[:space:]]*$/\1/p' build.gradle.kts)"
        source_agp="$(sed -nE 's/^agp = "([^"]+)"$/\1/p' "$catalog")"
        [[ -n "$app_agp" && -n "$source_agp" ]] || {
          echo "::error::Cannot identify both Android Gradle plugin versions."
          exit 1
        }
        catalog_patch="none"
        if [[ "$source_agp" != "$app_agp" ]]; then
          # Only authorize the build-tool version line; keep all MIUIX UI code identical.
          [[ "$source_agp" == "9.4.1" && "$app_agp" == "9.5.0" ]] || {
            echo "::error::Unreviewed MIUIX/app AGP combination: $source_agp / $app_agp"
            exit 1
          }
          test "$(grep -Ec '^agp = "9\.4\.1"$' "$catalog")" = 1
          sed -i 's/^agp = "9\.4\.1"$/agp = "9.5.0"/' "$catalog"
          test "$(git -C miuix-upstream diff --name-only)" = "gradle/libs.versions.toml"
          test "$(git -C miuix-upstream diff --numstat)" = "$(printf '1\t1\tgradle/libs.versions.toml')"
          git -C miuix-upstream diff --unified=0 -- gradle/libs.versions.toml | grep -Fx -- '-agp = "9.4.1"'
          git -C miuix-upstream diff --unified=0 -- gradle/libs.versions.toml | grep -Fx -- '+agp = "9.5.0"'
          catalog_patch="agp:9.4.1->9.5.0"
        fi
        test "$(sed -nE 's/^agp = "([^"]+)"$/\1/p' "$catalog")" = "$app_agp"
        test "$(git -C miuix-upstream rev-parse HEAD)" = "$expected"
        git -C miuix-upstream diff --check
        echo "MIUIX_SOURCE_AGP_VERSION=$app_agp" >> "$GITHUB_ENV"
        echo "MIUIX_SOURCE_CATALOG_PATCH=$catalog_patch" >> "$GITHUB_ENV"
        {
          echo "### MIUIX composite-build provenance"
          echo "- Upstream source commit: $expected (unchanged)"
          echo "- Source code/UI before the separately tracked navigation patch: unchanged"
          echo "- Build-only version catalog adjustment: $catalog_patch"
          echo "- Effective AGP in app and MIUIX: $app_agp"
        } >> "$GITHUB_STEP_SUMMARY"

    # Temporary, exact-source patch for the upstream predictive-back completion
    # handoff. Remove this when a separately qualified pinned upstream revision
    # contains an equivalent tested fix. Neither the SystemUI binary nor the
    # app's independent swipe-dismiss gesture owner is modified.
    - name: Enforce directional commit velocity on pinned MIUIX navigation
      shell: bash
      run: |
        set -euo pipefail
        expected="$(sed -n 's/^miuix.upstream.revision=//p' gradle.properties)"
        test "$expected" = "b9f70838509fbc3f63f1a972777a7e6ce07f578f"
        test "$(git -C miuix-upstream rev-parse HEAD)" = "$expected"
        source_path="miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavDisplay.kt"
        test "$(git -C miuix-upstream rev-parse "HEAD:$source_path")" = "c6f6c28f0efa33866e743ec26447683b0c19b09b"
        patch_file="$GITHUB_WORKSPACE/third_party/miuix-nav/patches/0001-commit-backward-velocity.patch"
        git -C miuix-upstream apply --check "$patch_file"
        git -C miuix-upstream apply "$patch_file"
        test "$(git -C miuix-upstream diff --name-only -- "$source_path")" = "$source_path"
        test "$(git -C miuix-upstream diff --numstat -- "$source_path")" = "$(printf '2\\t1\\t%s' "$source_path")"
        test "$(grep -Fc 'initialVelocity = released.coerceIn(floor, 0f),' "miuix-upstream/$source_path")" = 1
        test "$(git -C miuix-upstream diff --name-only)" = "$(printf 'gradle/libs.versions.toml\\n%s' "$source_path")"
        git -C miuix-upstream diff --check
        echo "MIUIX_SOURCE_NAV_PATCH=predictive-back-commit-direction-v1" >> "$GITHUB_ENV"
        {
          echo "### Predictive-back completion direction"
          echo "- Original upstream revision: $expected (source revision pinned)"
          echo "- Patched file: $source_path"
          echo "- Original Git blob: c6f6c28f0efa33866e743ec26447683b0c19b09b"
          echo "- Change: prevent a committed back from starting with reverse-direction velocity"
          echo "- Separate app swipe-dismiss and platform cancel callbacks: unchanged"
          echo "- See Guiyuan issue #1159; patch is removable after qualified upstream replacement"
        } >> "$GITHUB_STEP_SUMMARY"
