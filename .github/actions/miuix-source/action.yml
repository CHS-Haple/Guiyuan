name: Pinned MIUIX source
description: Checkout and verify the pinned MIUIX graph shared by OS3 and OS4 variants.
runs:
  using: composite
  steps:
    - name: Resolve the single source-pinned MIUIX SHA
      id: pinned
      shell: bash
      run: |
        set -euo pipefail
        revision="$(sed -n 's/^miuix.upstream.revision=//p' gradle.properties)"
        if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Expected exactly one full lowercase MIUIX revision in gradle.properties."
          exit 1
        fi
        echo "revision=$revision" >> "$GITHUB_OUTPUT"

    - name: Checkout exact pinned MIUIX source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: compose-miuix-ui/miuix
        ref: ${{ steps.pinned.outputs.revision }}
        path: miuix-upstream
        persist-credentials: false
    - name: Verify exact source revision and Glass integration files
      shell: bash
      run: |
        set -euo pipefail
        expected="$(sed -n 's/^miuix.upstream.revision=//p' gradle.properties)"
        actual="$(git -C miuix-upstream rev-parse HEAD)"
        test -n "$expected" && test "$actual" = "$expected"
        test -f miuix-upstream/miuix-ui/build.gradle.kts
        test -f miuix-upstream/miuix-blur/build.gradle.kts
        test -f miuix-upstream/miuix-material/build.gradle.kts
        test -f miuix-upstream/miuix-core/build.gradle.kts
        test -f miuix-upstream/miuix-preference/build.gradle.kts
        test -f miuix-upstream/miuix-glass/build.gradle.kts
        test -f miuix-upstream/miuix-glass-icons/build.gradle.kts
        test -f app/src/main/kotlin/com/chaners/guiyuan/ui/glass/GlassNavigationBar.kt
        test -f app/src/main/kotlin/com/chaners/guiyuan/ui/glass/GlassIconButton.kt
        echo "MIUIX_SOURCE_REVISION=$expected" >> "$GITHUB_ENV"
        echo "MIUIX_SOURCE_DIR=miuix-upstream" >> "$GITHUB_ENV"

    # Source graph and build tool must agree without editing the upstream checkout.
    - name: Verify pinned MIUIX Android Gradle plugin parity
      shell: bash
      run: |
        set -euo pipefail
        catalog="miuix-upstream/gradle/libs.versions.toml"
        expected="$(sed -n 's/^miuix.upstream.revision=//p' gradle.properties)"
        test "$(git -C miuix-upstream rev-parse HEAD)" = "$expected"
        git -C miuix-upstream diff --quiet
        app_agp="$(sed -nE 's/^[[:space:]]*id\("com\.android\.application"\) version "([^"]+)" apply false[[:space:]]*$/\1/p' build.gradle.kts)"
        source_agp="$(sed -nE 's/^agp = "([^"]+)"$/\1/p' "$catalog")"
        [[ -n "$app_agp" && -n "$source_agp" ]] || {
          echo "::error::Cannot identify both Android Gradle plugin versions."
          exit 1
        }
        [[ "$source_agp" == "$app_agp" ]] || {
          echo "::error::MIUIX/app AGP mismatch: $source_agp / $app_agp; do not mutate upstream source."
          exit 1
        }
        echo "MIUIX_SOURCE_AGP_VERSION=$app_agp" >> "$GITHUB_ENV"
        echo "MIUIX_SOURCE_CATALOG_PATCH=none" >> "$GITHUB_ENV"
        {
          echo "### MIUIX composite-build provenance"
          echo "- Upstream source commit: $expected"
          echo "- Source graph and build catalog: unchanged"
          echo "- Effective matched AGP: $app_agp"
        } >> "$GITHUB_STEP_SUMMARY"
