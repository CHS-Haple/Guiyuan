version: 2

registries:
  miuix-github-packages:
    type: maven-repository
    url: https://maven.pkg.github.com/compose-miuix-ui/miuix
    username: ${{secrets.MIUIX_GITHUB_ACTOR}}
    password: ${{secrets.MIUIX_GITHUB_TOKEN}}

updates:
  - package-ecosystem: gradle
    directory: "/"
    target-branch: dev
    registries:
      - miuix-github-packages
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
