name: OS4 MIUIX upstream source probe

# Runs only when this experimental check is created/changed, or on demand.
# Deliberately separate from Guiyuan's signed APK and package-token workflows.
on:
  push:
    branches: [ feat/os4-glass-experimental ]
    paths:
      - '.github/workflows/os4-miuix-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os4-upstream-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout pinned upstream PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: compose-miuix-ui/miuix
          ref: b9f70838509fbc3f63f1a972777a7e6ce07f578f
          path: upstream
          persist-credentials: false

      - name: Verify exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "b9f70838509fbc3f63f1a972777a7e6ce07f578f"
          test -f upstream/miuix-glass/build.gradle.kts
          test -f upstream/miuix-blur/build.gradle.kts
          test -f upstream/miuix-ui/build.gradle.kts
          test -f upstream/miuix-core/build.gradle.kts
          test -f upstream/miuix-shader/build.gradle.kts

      - name: Validate upstream Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up isolated Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Compile same-revision Android module graph
        working-directory: upstream
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/miuix-pr423-gradle
        run: |
          ./gradlew \
            :miuix-glass:compileAndroidMain \
            :miuix-glass-icons:compileAndroidMain \
            :miuix-preference:compileAndroidMain \
            :miuix-nav:compileAndroidMain \
            --no-daemon --stacktrace

      - name: State evidence boundary
        if: always()
        shell: bash
        run: |
          echo 'This checks pinned upstream Android Kotlin source compilation only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Guiyuan app, package registry, signing keys, release artifact, or device behavior is validated.' >> "$GITHUB_STEP_SUMMARY"
