name: OS4 MIUIX-to-Guiyuan source compatibility

# Experimental CI-only Android compile. No signing, no package publication.
on:
  push:
    branches: [ feat/os4-glass-experimental ]
    paths:
      - '.github/workflows/os4-miuix-app-compat-probe.yml'
      - 'settings.gradle.kts'
      - 'app/build.gradle.kts'
      - 'app/src/os4Upstream/**'
      - 'app/src/os4Published/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os4-miuix-app-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - name: Checkout Guiyuan OS4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gui
          persist-credentials: false

      - name: Checkout published source baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: compose-miuix-ui/miuix
          ref: 8972f941c194bd3c4e14c34543d5ebc7b39e40da
          path: upstream-published
          persist-credentials: false

      - name: Checkout exact upstream revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: compose-miuix-ui/miuix
          ref: b9f70838509fbc3f63f1a972777a7e6ce07f578f
          path: upstream
          persist-credentials: false

      - name: Validate source and no duplicate Glass module
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "b9f70838509fbc3f63f1a972777a7e6ce07f578f"
          test "$(git -C upstream-published rev-parse HEAD)" = "8972f941c194bd3c4e14c34543d5ebc7b39e40da"
          test -f gui/app/src/main/kotlin/top/yukonga/miuix/kmp/glass/GlassTopAppBar.kt
          test -f upstream/miuix-blur/build.gradle.kts
          test -f upstream/miuix-ui/build.gradle.kts
          test -f upstream/miuix-core/build.gradle.kts

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android API 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Setup Gradle without persistent cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Compile Guiyuan with upstream matching core UI and Blur
        working-directory: gui
        shell: bash
        run: ./gradlew -Pgy.os4.miuixDir=../upstream -Pgy.os4.dialogSurfaces=true :app:compileDebugKotlin --no-daemon --max-workers=2 --stacktrace

      - name: Assemble published-source control APK
        working-directory: gui
        shell: bash
        run: |
          ./gradlew -Pgy.os4.miuixDir=../upstream-published -Pgy.os4.debugSuffix=.os4published :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Guiyuan-OS4-published-Blur-debug.apk

      - name: Assemble fixed PR423 comparison APK
        working-directory: gui
        shell: bash
        run: |
          ./gradlew -Pgy.os4.miuixDir=../upstream -Pgy.os4.dialogSurfaces=true -Pgy.os4.debugSuffix=.os4pr423 :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Guiyuan-OS4-PR423-Blur-debug.apk

      - name: Verify isolated APK identities and debug signatures
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          for variant in published pr423; do
            if [[ "$variant" == "published" ]]; then
              apk=dist/Guiyuan-OS4-published-Blur-debug.apk
            else
              apk=dist/Guiyuan-OS4-PR423-Blur-debug.apk
            fi
            "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose "$apk"
            "$SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$apk" |
              grep -F "package: name='com.chaners.guiyuan.os4$variant'"
          done

      - name: Upload side-by-side unsigned-production debug pair
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Guiyuan-OS4-Blur-A-B-source-compare
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Explain the compatibility boundary
        if: always()
        run: |
          echo 'This checks Guiyuan compile-time compatibility with the fixed upstream source graph.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The upstream Glass module is excluded; two debug-signed APKs have isolated application IDs, not Guiyuan production identity or certificate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A/B visual evidence still requires a device; do not enable the Xposed module using these parallel UI probes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Any failure needs root-cause classification before runtime dependencies are changed.' >> "$GITHUB_STEP_SUMMARY"
