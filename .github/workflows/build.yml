name: Build
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('{0} | CI #{1}', github.event.pull_request.title, github.event.pull_request.number)
      || github.event_name == 'push'
      && format('ci: Validate {0} | CI', github.ref_name)
      || 'ci: Manual validation | CI' }}

on:
  push:
    branches: [ main, dev, it ]
  pull_request:
    branches: [ main, dev, it ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      run_canary: ${{ steps.scope.outputs.run_canary }}
      version_name: ${{ steps.identity.outputs.version_name }}
      build_id: ${{ steps.identity.outputs.build_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Signed PR artifacts must be compiled from the named PR HEAD, not the synthetic merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          SCOPE=full
          REASON="trusted main/manual validation"
          SURFACE_DIFF_AVAILABLE=false
          HAS_RUNTIME=false
          HAS_CI=false
          HAS_TOOLING=false
          HAS_BUILD=false
          HAS_DOCS=false
          MIXED_SURFACE=false
          MIXED_SURFACE_REASON=""
          DEVICE_APK=false

          detect_device_apk() {
            local base_sha="$1" head_sha="$2"
            local old_props new_props old_code new_code old_build new_build
            old_props="$(git show "$base_sha:gradle.properties")"
            new_props="$(git show "$head_sha:gradle.properties")"
            old_code="$(sed -n 's/^combinedStatus.versionCode=//p' <<< "$old_props")"
            new_code="$(sed -n 's/^combinedStatus.versionCode=//p' <<< "$new_props")"
            old_build="$(sed -n 's/^combinedStatus.buildId=//p' <<< "$old_props")"
            new_build="$(sed -n 's/^combinedStatus.buildId=//p' <<< "$new_props")"
            [[ "$old_code" =~ ^[1-9][0-9]*$ && "$new_code" =~ ^[1-9][0-9]*$ &&
               "$old_build" =~ ^[0-9]{8}-[0-9]+$ && "$new_build" =~ ^[0-9]{8}-[0-9]+$ ]] || {
              echo "::error::Missing or invalid Build identity in Git history."
              exit 1
            }
            if [[ "$old_code" != "$new_code" || "$old_build" != "$new_build" ]]; then
              [[ "$old_code" != "$new_code" && "$old_build" != "$new_build" ]] || {
                echo "::error::A delivery checkpoint must change versionCode and buildId together."
                exit 1
              }
              (( new_code > old_code )) || {
                echo "::error::Device checkpoint versionCode must increase relative to its branch base."
                exit 1
              }
              # An installable checkpoint must also upgrade the other protected channels.
              local channel channel_props channel_code channel_build
              for channel in main dev it; do
                # A protected push has already been compared with its previous commit.
                if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/$channel" ]]; then
                  continue
                fi
                channel_props="$(git show "refs/remotes/origin/$channel:gradle.properties")" || {
                  echo "::error::Cannot verify the $channel Build identity."
                  exit 1
                }
                channel_code="$(sed -n 's/^combinedStatus.versionCode=//p' <<< "$channel_props")"
                channel_build="$(sed -n 's/^combinedStatus.buildId=//p' <<< "$channel_props")"
                [[ "$channel_code" =~ ^[1-9][0-9]*$ && "$channel_build" =~ ^[0-9]{8}-[0-9]+$ ]] || {
                  echo "::error::Invalid $channel Build identity."
                  exit 1
                }
                if (( new_code <= channel_code )) || [[ "$new_build" == "$channel_build" ]]; then
                  echo "::error::Device checkpoint $new_build ($new_code) cannot upgrade or uniquely identify the $channel Build $channel_build ($channel_code)."
                  exit 1
                fi
              done
              DEVICE_APK=true
            fi
          }

          has_non_routine_gradle_properties() {
            local base_sha="$1"
            local head_sha="$2"
            local changes

            changes="$(
              git diff --unified=0 "$base_sha" "$head_sha" -- gradle.properties |
                awk '/^[+-][^+-]/ {
                  line = substr($0, 2)
                  if (line !~ /^combinedStatus\.(versionCode|buildId)=/) {
                    print line
                  }
                }'
            )"
            [[ -n "$changes" ]]
          }

          detect_surfaces() {
            local base_sha="$1"
            local head_sha="$2"

            if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              return
            fi

            SURFACE_DIFF_AVAILABLE=true
            mapfile -t SURFACE_CHANGED_FILES < <(git diff --name-only "$base_sha" "$head_sha")

            for path in "${SURFACE_CHANGED_FILES[@]}"; do
              case "$path" in
                .github/workflows/*|.github/dependabot.yml)
                  HAS_CI=true
                  ;;
                tools/*)
                  HAS_TOOLING=true
                  ;;
                gradle/*|build.gradle.kts|settings.gradle.kts|app/build.gradle.kts|app/proguard-rules.pro|gradlew|gradlew.bat)
                  HAS_BUILD=true
                  ;;
                gradle.properties)
                  if has_non_routine_gradle_properties "$base_sha" "$head_sha"; then
                    HAS_BUILD=true
                  fi
                  ;;
                app/*|compat/*)
                  HAS_RUNTIME=true
                  ;;
                docs/*|README.md|README_zh-CN.md|CHANGELOG.md|CONTRIBUTING.md|LICENSE)
                  HAS_DOCS=true
                  ;;
              esac
            done

            if [[ "$HAS_RUNTIME" == "true" && ( "$HAS_CI" == "true" || "$HAS_TOOLING" == "true" || "$HAS_BUILD" == "true" ) ]]; then
              MIXED_SURFACE=true
              MIXED_SURFACE_REASON="runtime and build/CI/tooling surfaces share one diff"
            fi
          }

          apply_runtime_scope() {
            local mode="$1"
            case "$mode" in
              runtime)
                if [[ "$SCOPE" != "full" ]]; then
                  SCOPE=runtime
                  REASON="ordinary runtime validation"
                fi
                ;;
              full)
                SCOPE=full
                REASON="stable/full runtime validation"
                ;;
            esac
          }

          classify_paths() {
            local base_sha="$1"
            local head_sha="$2"
            local runtime_mode="$3"

            SCOPE=light
            REASON="mechanical/documentation-only change"

            mapfile -t CHANGED_FILES < <(git diff --name-only "$base_sha" "$head_sha")
            for path in "${CHANGED_FILES[@]}"; do
              case "$path" in
                .github/workflows/*|.github/dependabot.yml|gradle/*|tools/*|build.gradle.kts|settings.gradle.kts|app/build.gradle.kts|app/proguard-rules.pro|gradlew|gradlew.bat)
                  SCOPE=full
                  REASON="build/CI/dependency-affecting path changed: $path"
                  break
                  ;;
                gradle.properties)
                  if has_non_routine_gradle_properties "$base_sha" "$head_sha"; then
                    SCOPE=full
                    REASON="non-routine Gradle property changed"
                    break
                  fi
                  apply_runtime_scope "$runtime_mode"
                  ;;
                app/*|compat/*)
                  apply_runtime_scope "$runtime_mode"
                  ;;
              esac
            done
          }

          if [[ "$EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/dev" || "$GITHUB_REF" == "refs/heads/it" ) ]]; then
            if [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              classify_paths "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" runtime
              detect_surfaces "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
            fi
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              classify_paths "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" full
              detect_surfaces "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Only the PR's changes count; the base branch may have advanced independently.
            PR_DIFF_BASE="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            if [[ "$PR_BASE_REF" == "dev" || "$PR_BASE_REF" == "main" ]]; then
              if [[ "$PR_HEAD_REF" == "it" ]]; then
                echo "::error::IT branch must not merge wholesale into $PR_BASE_REF. Port reviewed public fixes from a fresh dev branch."
                exit 1
              fi
              if git diff --name-only "$PR_DIFF_BASE" "$PR_HEAD_SHA" | grep -Eq '^(app/src/internal/|it-only/)'; then
                echo "::error::IT-exclusive files may not enter public branches."
                exit 1
              fi
            fi
            detect_surfaces "$PR_DIFF_BASE" "$PR_HEAD_SHA"
            if [[ "$PR_DRAFT" == "true" ]]; then
              SCOPE=light
              REASON="draft pull request"
            elif [[ "$PR_BASE_REF" == "main" ]]; then
              classify_paths "$PR_DIFF_BASE" "$PR_HEAD_SHA" full
            else
              classify_paths "$PR_DIFF_BASE" "$PR_HEAD_SHA" runtime
            fi
          fi

          if [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" &&
                "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            detect_device_apk "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            detect_device_apk "$PR_DIFF_BASE" "$PR_HEAD_SHA"
          fi

          if [[ "$DEVICE_APK" == "true" && "$SCOPE" == "light" && "$PR_DRAFT" != "true" ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/main" || "$PR_BASE_REF" == "main" ]]; then
              SCOPE=full
            else
              SCOPE=runtime
            fi
            REASON="explicit APK delivery checkpoint: Build identity changed"
          fi

          if [[ "$MIXED_SURFACE" == "true" ]]; then
            echo "::warning title=Mixed validation surfaces::$MIXED_SURFACE_REASON. Full remains required while these surfaces are combined. If they are independently mergeable and reversible, isolate the build/CI/tooling change and back-sync it before continuing ordinary runtime work."
          fi

          RUN_ANDROID=false
          RUN_DEBUG=false
          RUN_CANARY=false

          if [[ "$SCOPE" == "runtime" || "$SCOPE" == "full" ]]; then
            RUN_ANDROID=true
          fi
          if [[ ( "$SCOPE" == "full" || ( "$SCOPE" == "runtime" && ( "$EVENT_NAME" == "pull_request" || "$DEVICE_APK" == "false" ) ) ) &&
                ! ( "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ) &&
                ! ( "$EVENT_NAME" == "pull_request" && "$PR_BASE_REF" == "main" ) ]]; then
            RUN_DEBUG=true
          fi
          if [[ "$DEVICE_APK" == "true" &&
                ( ( "$SCOPE" == "full" && "$EVENT_NAME" == "pull_request" &&
                    ( "$PR_BASE_REF" != "main" ||
                      ( "$PR_HEAD_REF" == hotfix/* && "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ) ) ) ||
                ( "$SCOPE" == "runtime" && "$EVENT_NAME" == "pull_request" && "$PR_BASE_REF" != "main" && "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ) ||
                ( ( "$SCOPE" == "runtime" || "$SCOPE" == "full" ) && "$EVENT_NAME" == "push" &&
                    ( "$GITHUB_REF" == "refs/heads/dev" || "$GITHUB_REF" == "refs/heads/it" ) ) ) ]]; then
            RUN_CANARY=true
          fi

          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "run_android=$RUN_ANDROID" >> "$GITHUB_OUTPUT"
          echo "run_debug=$RUN_DEBUG" >> "$GITHUB_OUTPUT"
          echo "run_canary=$RUN_CANARY" >> "$GITHUB_OUTPUT"
          echo "device_apk=$DEVICE_APK" >> "$GITHUB_OUTPUT"
          echo "surface_diff_available=$SURFACE_DIFF_AVAILABLE" >> "$GITHUB_OUTPUT"
          echo "has_runtime=$HAS_RUNTIME" >> "$GITHUB_OUTPUT"
          echo "has_ci=$HAS_CI" >> "$GITHUB_OUTPUT"
          echo "has_tooling=$HAS_TOOLING" >> "$GITHUB_OUTPUT"
          echo "has_build=$HAS_BUILD" >> "$GITHUB_OUTPUT"
          echo "has_docs=$HAS_DOCS" >> "$GITHUB_OUTPUT"
          echo "mixed_surface=$MIXED_SURFACE" >> "$GITHUB_OUTPUT"
          echo "mixed_surface_reason=$MIXED_SURFACE_REASON" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $SCOPE ($REASON)"

      - name: Early PR diff / light repository checks
        if: github.event_name == 'pull_request' || steps.scope.outputs.scope == 'light'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            fi
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Checkout accepted MIUIX source
        if: steps.scope.outputs.run_android == 'true'
        uses: ./.github/actions/miuix-source

      - name: Validate Gradle Wrapper
        if: steps.scope.outputs.run_android == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java
        if: steps.scope.outputs.run_android == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        if: steps.scope.outputs.run_android == 'true'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up source-matched Gradle with trusted cache
        if: steps.scope.outputs.run_android == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          # Only the reviewed main branch seeds reusable Gradle state.
          # PR and dev builds may restore it but cannot overwrite it.
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Verify pinned HyperOS target profile
        if: steps.scope.outputs.run_android == 'true'
        run: python3 tools/verify_target_profile.py

      - name: Test and build required APK variants
        if: steps.scope.outputs.run_android == 'true'
        shell: bash
        run: |
          TASKS=(":app:testDebugUnitTest")
          if [[ "${{ steps.scope.outputs.run_debug }}" == "true" ]]; then
            TASKS+=(":app:assembleDebug")
          fi
          if [[ "${{ steps.scope.outputs.run_canary }}" == "true" ]]; then
            TASKS+=(":app:assembleCanary")
          fi
          if [[ "${{ steps.scope.outputs.scope }}" == "full" &&
                ( ( "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.base.ref }}" == "main" ) ||
                  ( "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ) ) ]]; then
            TASKS+=(":app:assembleRelease")
          fi
          test -n "$MIUIX_SOURCE_REVISION" && test -n "$MIUIX_SOURCE_DIR"
          ./gradlew \
            -Pgy.os4.miuixDir="$MIUIX_SOURCE_DIR" \
            -Pgy.os4.miuixRevision="$MIUIX_SOURCE_REVISION" \
            -Pgy.os4.dialogSurfaces=true \
            "${TASKS[@]}" --no-daemon --max-workers=2 --stacktrace

      - name: Resolve built APK paths
        if: steps.scope.outputs.run_android == 'true'
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.run_debug }}" == "true" ]]; then
            DEBUG_APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            if [[ ! -f "$DEBUG_APK_PATH" ]]; then
              echo "Debug APK output was not found."
              exit 1
            fi
            echo "DEBUG_APK_PATH=$DEBUG_APK_PATH" >> "$GITHUB_ENV"
          fi

          if [[ "${{ steps.scope.outputs.run_canary }}" == "true" ]]; then
            if [[ -f "app/build/outputs/apk/canary/app-canary-unsigned.apk" ]]; then
              CANARY_APK_PATH="app/build/outputs/apk/canary/app-canary-unsigned.apk"
            else
              echo "Canary APK output was not found."
              exit 1
            fi
            echo "CANARY_APK_PATH=$CANARY_APK_PATH" >> "$GITHUB_ENV"
          fi

      - name: Verify modern Xposed metadata
        if: steps.scope.outputs.run_android == 'true'
        shell: bash
        run: |
          APKS=()
          if [[ "${{ steps.scope.outputs.run_debug }}" == "true" ]]; then
            APKS+=("$DEBUG_APK_PATH")
          fi
          if [[ "${{ steps.scope.outputs.run_canary }}" == "true" ]]; then
            APKS+=("$CANARY_APK_PATH")
          fi
          if [[ "${{ steps.scope.outputs.scope }}" == "full" &&
                ( ( "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.base.ref }}" == "main" ) ||
                  ( "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ) ) ]]; then
            APKS+=("app/build/outputs/apk/release/app-release-unsigned.apk")
          fi
          bash tools/verify_xposed_metadata.sh "${APKS[@]}"

      - name: Verify IT version suffix on installable candidates
        if: steps.scope.outputs.run_android == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/it') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'it' && github.event.pull_request.head.repo.full_name == github.repository))
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt="$SDK_ROOT/build-tools/37.0.0/aapt"
          base="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          expected="${base}-IT"
          for path in "${DEBUG_APK_PATH:-}" "${CANARY_APK_PATH:-}"; do
            [[ -z "$path" ]] && continue
            test -s "$path"
            actual="$("$aapt" dump badging "$path" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" | head -n 1)"
            test "$actual" = "$expected" || { echo "::error::IT candidate $path version=$actual, expected=$expected"; exit 1; }
          done

      - name: Verify canary is non-debuggable
        if: steps.scope.outputs.run_canary == 'true'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          if [[ -z "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found."
            exit 1
          fi

          if [[ "$("$APKANALYZER" manifest debuggable "$CANARY_APK_PATH")" != "false" ]]; then
            echo "Canary APK must be non-debuggable."
            exit 1
          fi

      - name: Record exact source Build identity
        id: identity
        if: steps.scope.outputs.run_canary == 'true'
        shell: bash
        run: |
          echo "version_name=$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "build_id=$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Pass unsigned Canary to isolated signing job
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.scope.outputs.run_canary == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-ci-canary-${{ github.sha }}
          path: app/build/outputs/apk/canary/app-canary-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Store verified unsigned PR Canary for on-demand signing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.scope.outputs.run_canary == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-pr-canary-${{ github.event.pull_request.head.sha }}
          path: app/build/outputs/apk/canary/app-canary-unsigned.apk
          if-no-files-found: error
          retention-days: 3

      - name: Store unsigned protected IT Canary for future trusted signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/it' && steps.scope.outputs.run_canary == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-it-canary-${{ github.sha }}
          path: app/build/outputs/apk/canary/app-canary-unsigned.apk
          if-no-files-found: error
          retention-days: 3

      - name: Transfer verified main unsigned Release for isolated signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scope.outputs.scope == 'full' && steps.scope.outputs.device_apk == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-main-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          echo "### Build validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation scope: ${{ steps.scope.outputs.scope }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Routing reason: ${{ steps.scope.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installable APK checkpoint: ${{ steps.scope.outputs.device_apk }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.scope.outputs.surface_diff_available }}" == "true" ]]; then
            echo "- Changed surfaces: runtime=${{ steps.scope.outputs.has_runtime }}, build=${{ steps.scope.outputs.has_build }}, CI=${{ steps.scope.outputs.has_ci }}, tooling=${{ steps.scope.outputs.has_tooling }}, docs=${{ steps.scope.outputs.has_docs }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Changed surfaces: unavailable for this trigger" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.scope.outputs.mixed_surface }}" == "true" ]]; then
            echo "- Mixed-surface review: **required** — ${{ steps.scope.outputs.mixed_surface_reason }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Guidance: keep Full while combined; split only when the high-risk surface is independently mergeable/reversible, then back-sync before ordinary runtime work continues." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Mixed-surface review: not required" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.scope.outputs.run_android }}" == "true" ]]; then
            echo "- MIUIX: accepted source graph ${MIUIX_SOURCE_REVISION:-unverified}; glass dialog surfaces enabled" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Signed work-branch Canary: explicit/demand-driven and independently validates the requested source SHA." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "- Pull request state: draft (lightweight validation only)" >> "$GITHUB_STEP_SUMMARY"
          fi

  sign-canary:
    name: Sign Canary
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.build.outputs.run_canary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout trusted signing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/setup_haple_signing.sh

      - name: Download unsigned source-built Canary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-ci-canary-${{ github.sha }}
          path: candidate

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "build-tools;37.0.0"

      - name: Restore trusted signing identity
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: bash tools/setup_haple_signing.sh

      - name: Sign and validate Canary without executing candidate source
        shell: bash
        env:
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: |
          set -euo pipefail
          source="candidate/app-canary-unsigned.apk"
          test -s "$source"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          signer="$SDK_ROOT/build-tools/37.0.0/apksigner"
          version="${{ needs.build.outputs.version_name }}"
          build="${{ needs.build.outputs.build_id }}"
          test -n "$version" && test -n "$build"
          mkdir -p dist
          apk="dist/Guiyuan-${version}-HyperOS-${build}-canary.apk"
          "$signer" sign --ks "$HAPLE_KEYSTORE_PATH" --ks-key-alias "$HAPLE_KEY_ALIAS" \
            --ks-pass env:HAPLE_KEYSTORE_PASSWORD --key-pass env:HAPLE_KEYSTORE_PASSWORD \
            --out "$apk" "$source"
          "$signer" verify --verbose --print-certs "$apk"
          cert="$("$signer" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "$HAPLE_CERT_SHA256"
          package="$("$SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$apk" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$package" = com.chaners.guiyuan
          version_in_apk="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<< "$("$SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$apk")" | head -n 1)"
          test "$version_in_apk" = "$version"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test "$("$APKANALYZER" manifest debuggable "$apk")" = false
          echo "APK_NAME=$(basename "$apk")" >> "$GITHUB_ENV"
          sha256sum "$apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed dev Canary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
