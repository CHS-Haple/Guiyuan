name: Build
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event_name == 'push' && github.event.head_commit.message || 'Build' }}

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  statuses: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIUIX_GITHUB_ACTOR: ${{ github.repository_owner }}
      MIUIX_GITHUB_TOKEN: ${{ secrets.MIUIX_GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          SCOPE=full
          REASON="trusted main/manual validation"
          SURFACE_DIFF_AVAILABLE=false
          HAS_RUNTIME=false
          HAS_CI=false
          HAS_TOOLING=false
          HAS_BUILD=false
          HAS_DOCS=false
          MIXED_SURFACE=false
          MIXED_SURFACE_REASON=""

          has_non_routine_gradle_properties() {
            local base_sha="$1"
            local head_sha="$2"
            local changes

            changes="$(
              git diff --unified=0 "$base_sha" "$head_sha" -- gradle.properties |
                awk '/^[+-][^+-]/ {
                  line = substr($0, 2)
                  if (line !~ /^combinedStatus\.(versionCode|buildId)=/) {
                    print line
                  }
                }'
            )"
            [[ -n "$changes" ]]
          }

          detect_surfaces() {
            local base_sha="$1"
            local head_sha="$2"

            if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              return
            fi

            SURFACE_DIFF_AVAILABLE=true
            mapfile -t SURFACE_CHANGED_FILES < <(git diff --name-only "$base_sha" "$head_sha")

            for path in "${SURFACE_CHANGED_FILES[@]}"; do
              case "$path" in
                .github/workflows/*)
                  HAS_CI=true
                  ;;
                tools/*)
                  HAS_TOOLING=true
                  ;;
                gradle/*|build.gradle.kts|settings.gradle.kts|app/build.gradle.kts|app/proguard-rules.pro|gradlew|gradlew.bat)
                  HAS_BUILD=true
                  ;;
                gradle.properties)
                  if has_non_routine_gradle_properties "$base_sha" "$head_sha"; then
                    HAS_BUILD=true
                  fi
                  ;;
                app/*|compat/*)
                  HAS_RUNTIME=true
                  ;;
                docs/*|README.md|README_zh-CN.md|CHANGELOG.md|CONTRIBUTING.md|LICENSE)
                  HAS_DOCS=true
                  ;;
              esac
            done

            if [[ "$HAS_RUNTIME" == "true" && ( "$HAS_CI" == "true" || "$HAS_TOOLING" == "true" || "$HAS_BUILD" == "true" ) ]]; then
              MIXED_SURFACE=true
              MIXED_SURFACE_REASON="runtime and build/CI/tooling surfaces share one diff"
            fi
          }

          apply_runtime_scope() {
            local mode="$1"
            case "$mode" in
              runtime)
                if [[ "$SCOPE" != "full" ]]; then
                  SCOPE=runtime
                  REASON="ordinary runtime validation"
                fi
                ;;
              full)
                SCOPE=full
                REASON="stable/full runtime validation"
                ;;
            esac
          }

          classify_paths() {
            local base_sha="$1"
            local head_sha="$2"
            local runtime_mode="$3"

            SCOPE=light
            REASON="mechanical/documentation-only change"

            mapfile -t CHANGED_FILES < <(git diff --name-only "$base_sha" "$head_sha")
            for path in "${CHANGED_FILES[@]}"; do
              case "$path" in
                .github/workflows/*|gradle/*|tools/*|build.gradle.kts|settings.gradle.kts|app/build.gradle.kts|app/proguard-rules.pro|gradlew|gradlew.bat)
                  SCOPE=full
                  REASON="build/CI/dependency-affecting path changed: $path"
                  break
                  ;;
                gradle.properties)
                  if has_non_routine_gradle_properties "$base_sha" "$head_sha"; then
                    SCOPE=full
                    REASON="non-routine Gradle property changed"
                    break
                  fi
                  apply_runtime_scope "$runtime_mode"
                  ;;
                app/*|compat/*)
                  apply_runtime_scope "$runtime_mode"
                  ;;
              esac
            done
          }

          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/dev" ]]; then
            if [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              classify_paths "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" runtime
              detect_surfaces "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
            fi
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              classify_paths "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" full
              detect_surfaces "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            detect_surfaces "$PR_BASE_SHA" "$PR_HEAD_SHA"
            if [[ "$PR_DRAFT" == "true" ]]; then
              SCOPE=light
              REASON="draft pull request"
            elif [[ "$PR_BASE_REF" == "main" ]]; then
              classify_paths "$PR_BASE_SHA" "$PR_HEAD_SHA" full
            else
              classify_paths "$PR_BASE_SHA" "$PR_HEAD_SHA" runtime
            fi
          fi

          if [[ "$MIXED_SURFACE" == "true" ]]; then
            echo "::warning title=Mixed validation surfaces::$MIXED_SURFACE_REASON. Full remains required while these surfaces are combined. If they are independently mergeable and reversible, isolate the build/CI/tooling change and back-sync it before continuing ordinary runtime work."
          fi

          RUN_ANDROID=false
          RUN_DEBUG=false
          RUN_CANARY=false

          if [[ "$SCOPE" == "runtime" || "$SCOPE" == "full" ]]; then
            RUN_ANDROID=true
          fi
          if [[ "$SCOPE" == "full" || ( "$SCOPE" == "runtime" && "$EVENT_NAME" == "pull_request" ) ]]; then
            RUN_DEBUG=true
          fi
          if [[ "$SCOPE" == "full" || ( "$SCOPE" == "runtime" && "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/dev" ) ]]; then
            RUN_CANARY=true
          fi

          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "run_android=$RUN_ANDROID" >> "$GITHUB_OUTPUT"
          echo "run_debug=$RUN_DEBUG" >> "$GITHUB_OUTPUT"
          echo "run_canary=$RUN_CANARY" >> "$GITHUB_OUTPUT"
          echo "surface_diff_available=$SURFACE_DIFF_AVAILABLE" >> "$GITHUB_OUTPUT"
          echo "has_runtime=$HAS_RUNTIME" >> "$GITHUB_OUTPUT"
          echo "has_ci=$HAS_CI" >> "$GITHUB_OUTPUT"
          echo "has_tooling=$HAS_TOOLING" >> "$GITHUB_OUTPUT"
          echo "has_build=$HAS_BUILD" >> "$GITHUB_OUTPUT"
          echo "has_docs=$HAS_DOCS" >> "$GITHUB_OUTPUT"
          echo "mixed_surface=$MIXED_SURFACE" >> "$GITHUB_OUTPUT"
          echo "mixed_surface_reason=$MIXED_SURFACE_REASON" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $SCOPE ($REASON)"

      - name: Lightweight repository checks
        if: steps.scope.outputs.scope == 'light'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Validate Gradle Wrapper
        if: steps.scope.outputs.run_android == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java
        if: steps.scope.outputs.run_android == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        if: steps.scope.outputs.run_android == 'true'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        if: steps.scope.outputs.run_android == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Restore and verify Haple signing
        if: steps.scope.outputs.run_android == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: bash tools/setup_haple_signing.sh

      - name: Verify pinned HyperOS target profile
        if: steps.scope.outputs.run_android == 'true'
        run: python3 tools/verify_target_profile.py

      - name: Test and build required APK variants
        if: steps.scope.outputs.run_android == 'true'
        env:
          HAPLE_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.HAPLE_KEYSTORE_PASSWORD || '' }}
          HAPLE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.HAPLE_KEY_ALIAS || '' }}
        shell: bash
        run: |
          TASKS=(":app:testDebugUnitTest")
          if [[ "${{ steps.scope.outputs.run_debug }}" == "true" ]]; then
            TASKS+=(":app:assembleDebug")
          fi
          if [[ "${{ steps.scope.outputs.run_canary }}" == "true" ]]; then
            TASKS+=(":app:assembleCanary")
          fi
          ./gradlew "${TASKS[@]}" --stacktrace

      - name: Resolve built APK paths
        if: steps.scope.outputs.run_android == 'true'
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.run_debug }}" == "true" ]]; then
            DEBUG_APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            if [[ ! -f "$DEBUG_APK_PATH" ]]; then
              echo "Debug APK output was not found."
              exit 1
            fi
            echo "DEBUG_APK_PATH=$DEBUG_APK_PATH" >> "$GITHUB_ENV"
          fi

          if [[ "${{ steps.scope.outputs.run_canary }}" == "true" ]]; then
            if [[ -f "app/build/outputs/apk/canary/app-canary.apk" ]]; then
              CANARY_APK_PATH="app/build/outputs/apk/canary/app-canary.apk"
            elif [[ -f "app/build/outputs/apk/canary/app-canary-unsigned.apk" ]]; then
              CANARY_APK_PATH="app/build/outputs/apk/canary/app-canary-unsigned.apk"
            else
              echo "Canary APK output was not found."
              exit 1
            fi
            echo "CANARY_APK_PATH=$CANARY_APK_PATH" >> "$GITHUB_ENV"
          fi

      - name: Verify modern Xposed metadata
        if: steps.scope.outputs.run_android == 'true'
        shell: bash
        run: |
          APKS=()
          if [[ "${{ steps.scope.outputs.run_debug }}" == "true" ]]; then
            APKS+=("$DEBUG_APK_PATH")
          fi
          if [[ "${{ steps.scope.outputs.run_canary }}" == "true" ]]; then
            APKS+=("$CANARY_APK_PATH")
          fi
          bash tools/verify_xposed_metadata.sh "${APKS[@]}"
      - name: Verify Haple APK signatures
        if: steps.scope.outputs.run_android == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKS=()
          if [[ "${{ steps.scope.outputs.run_debug }}" == "true" ]]; then
            APKS+=("$DEBUG_APK_PATH")
          fi
          if [[ "${{ steps.scope.outputs.run_canary }}" == "true" ]]; then
            APKS+=("$CANARY_APK_PATH")
          fi

          for APK in "${APKS[@]}"; do
            "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"

            ACTUAL_CERT_SHA256="$(
              "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs "$APK" |
                awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' |
                tr '[:upper:]' '[:lower:]'
            )"

            if [[ "$ACTUAL_CERT_SHA256" != "$HAPLE_CERT_SHA256" ]]; then
              echo "Built APK is not signed by the Haple certificate: $APK"
              exit 1
            fi
          done

      - name: Verify canary is non-debuggable
        if: steps.scope.outputs.run_canary == 'true'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          if [[ -z "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found."
            exit 1
          fi

          if [[ "$("$APKANALYZER" manifest debuggable "$CANARY_APK_PATH")" != "false" ]]; then
            echo "Canary APK must be non-debuggable."
            exit 1
          fi

      - name: Prepare APKs
        if: steps.scope.outputs.run_android == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          mkdir -p dist

          if [[ "${{ steps.scope.outputs.run_debug }}" == "true" ]]; then
            DEBUG_APK_NAME="Guiyuan-${VERSION_NAME}-HyperOS-${BUILD_ID}-debug.apk"
            cp "$DEBUG_APK_PATH" "dist/$DEBUG_APK_NAME"
            echo "DEBUG_APK_NAME=$DEBUG_APK_NAME" >> "$GITHUB_ENV"
          fi

          if [[ "${{ steps.scope.outputs.run_canary }}" == "true" ]]; then
            CANARY_APK_NAME="Guiyuan-${VERSION_NAME}-HyperOS-${BUILD_ID}-canary.apk"
            cp "$CANARY_APK_PATH" "dist/$CANARY_APK_NAME"
            echo "CANARY_APK_NAME=$CANARY_APK_NAME" >> "$GITHUB_ENV"
          fi

      - name: Upload debug APK
        if: steps.scope.outputs.run_debug == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DEBUG_APK_NAME }}
          path: dist/${{ env.DEBUG_APK_NAME }}
          if-no-files-found: error

      - name: Upload canary APK
        if: steps.scope.outputs.run_canary == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANARY_APK_NAME }}
          path: dist/${{ env.CANARY_APK_NAME }}
          if-no-files-found: error

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          echo "### Build validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation scope: ${{ steps.scope.outputs.scope }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Routing reason: ${{ steps.scope.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.scope.outputs.surface_diff_available }}" == "true" ]]; then
            echo "- Changed surfaces: runtime=${{ steps.scope.outputs.has_runtime }}, build=${{ steps.scope.outputs.has_build }}, CI=${{ steps.scope.outputs.has_ci }}, tooling=${{ steps.scope.outputs.has_tooling }}, docs=${{ steps.scope.outputs.has_docs }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Changed surfaces: unavailable for this trigger" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.scope.outputs.mixed_surface }}" == "true" ]]; then
            echo "- Mixed-surface review: **required** — ${{ steps.scope.outputs.mixed_surface_reason }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Guidance: keep Full while combined; split only when the high-risk surface is independently mergeable/reversible, then back-sync before ordinary runtime work continues." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Mixed-surface review: not required" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Signed work-branch Canary: explicit/demand-driven and independently validates the requested source SHA." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "- Pull request state: draft (lightweight validation only)" >> "$GITHUB_STEP_SUMMARY"
          fi
