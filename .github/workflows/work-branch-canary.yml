name: Work Branch Canary
run-name: >-
  ${{ github.event_name == 'issue_comment'
      && github.event.issue.title
      || format('canary - {0}', inputs.source_branch) }}

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Trusted same-repository feat/*, fix/* or refactor/* branch to validate'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: read
  packages: read
  pull-requests: read

concurrency:
  group: work-canary-${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  canary:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.body == '/canary' &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIUIX_GITHUB_ACTOR: ${{ github.repository_owner }}
      MIUIX_GITHUB_TOKEN: ${{ secrets.MIUIX_GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve trusted source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_BRANCH: ${{ inputs.source_branch }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail


          case "$EVENT_NAME" in
            workflow_dispatch)
              branch="$MANUAL_SOURCE_BRANCH"
              if [[ "$branch" != feat/* && "$branch" != fix/* && "$branch" != refactor/* ]]; then
                echo "::error::Manual Canary source must be a feat/*, fix/* or refactor/* branch, got: $branch"
                exit 1
              fi
              source_sha="$(
                git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$branch" |
                  awk 'NR == 1 { print $1 }'
              )"
              if [[ -z "$source_sha" ]]; then
                echo "::error::Requested source branch does not exist in this repository: $branch"
                exit 1
              fi
              ;;
            issue_comment)
              pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$COMMENT_PR_NUMBER")"
              pr_state="$(jq -r '.state' <<<"$pr_json")"
              head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
              branch="$(jq -r '.head.ref // empty' <<<"$pr_json")"
              source_sha="$(jq -r '.head.sha // empty' <<<"$pr_json")"

              if [[ "$pr_state" != "open" ]]; then
                echo "::error::Comment-triggered Canary requires an open pull request."
                exit 1
              fi
              if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
                echo "::error::Comment-triggered Canary accepts same-repository pull requests only."
                exit 1
              fi

              ;;

            *)
              echo "::error::Unsupported trigger: $EVENT_NAME"
              exit 1
              ;;
          esac

          if [[ "$branch" != feat/* && "$branch" != fix/* && "$branch" != refactor/* ]]; then
            echo "::error::Canary source must be a feat/*, fix/* or refactor/* branch, got: $branch"
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a valid source SHA."
            exit 1
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' "### Trusted source"
            printf '%s\n' "- Trigger: \`$EVENT_NAME\`"
            printf '%s\n' "- Source branch: \`$branch\`"
            printf '%s\n' "- Resolved SHA: \`$source_sha\`"
            printf '%s\n' "- Validation: this workflow independently tests and builds the exact resolved source SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout tested work-branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          resolved_sha="$(git rev-parse HEAD)"
          if [[ "$resolved_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Checked-out SHA does not match the resolved trusted source."
            exit 1
          fi
          echo "TRUSTED_SOURCE_SHA=$resolved_sha" >> "$GITHUB_ENV"
          echo "TRUSTED_SOURCE_BRANCH=$EXPECTED_SOURCE_BRANCH" >> "$GITHUB_ENV"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Restore and verify Haple signing
        shell: bash
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: bash tools/setup_haple_signing.sh

      - name: Verify pinned HyperOS target profile
        run: python3 tools/verify_target_profile.py

      - name: Test and build Canary
        env:
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleCanary --stacktrace

      - name: Resolve Canary APK
        shell: bash
        run: |
          if [[ -f "app/build/outputs/apk/canary/app-canary.apk" ]]; then
            CANARY_APK_PATH="app/build/outputs/apk/canary/app-canary.apk"
          elif [[ -f "app/build/outputs/apk/canary/app-canary-unsigned.apk" ]]; then
            CANARY_APK_PATH="app/build/outputs/apk/canary/app-canary-unsigned.apk"
          else
            echo "Canary APK output was not found."
            exit 1
          fi
          echo "CANARY_APK_PATH=$CANARY_APK_PATH" >> "$GITHUB_ENV"

      - name: Verify modern Xposed metadata
        shell: bash
        run: |
          REQUIRED_ENTRIES=(
            "META-INF/xposed/java_init.list"
            "META-INF/xposed/module.prop"
            "META-INF/xposed/scope.list"
          )

          for entry in "${REQUIRED_ENTRIES[@]}"; do
            if ! unzip -Z1 "$CANARY_APK_PATH" | grep -Fxq "$entry"; then
              echo "Missing modern Xposed metadata: $entry"
              exit 1
            fi
          done

          if unzip -Z1 "$CANARY_APK_PATH" | grep -Fxq "assets/xposed_init"; then
            echo "Legacy Xposed entry metadata must not be packaged."
            exit 1
          fi

          if [[ "$(unzip -p "$CANARY_APK_PATH" META-INF/xposed/scope.list | tr -d '\r\n')" != "com.android.systemui" ]]; then
            echo "Unexpected Xposed scope."
            exit 1
          fi

          if ! unzip -p "$CANARY_APK_PATH" META-INF/xposed/module.prop | grep -Fxq "targetApiVersion=102"; then
            echo "Modern Xposed target API 102 metadata is missing."
            exit 1
          fi

          if ! unzip -p "$CANARY_APK_PATH" META-INF/xposed/module.prop | grep -Fxq "autoHotReload=true"; then
            echo "Modern Xposed hot reload metadata is missing."
            exit 1
          fi

          JAVA_ENTRY_COUNT="$(
            unzip -p "$CANARY_APK_PATH" META-INF/xposed/java_init.list |
              tr -d '\r' |
              sed '/^[[:space:]]*$/d' |
              wc -l |
              tr -d ' '
          )"
          if [[ "$JAVA_ENTRY_COUNT" != "1" ]]; then
            echo "Hot reload requires exactly one Java entry class."
            exit 1
          fi

      - name: Verify Haple APK signature
        shell: bash
        env:
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$CANARY_APK_PATH"

          ACTUAL_CERT_SHA256="$(
            "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs "$CANARY_APK_PATH" |
              awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$ACTUAL_CERT_SHA256" != "$HAPLE_CERT_SHA256" ]]; then
            echo "Built Canary is not signed by the Haple certificate."
            exit 1
          fi

      - name: Verify Canary is non-debuggable
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          if [[ -z "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found."
            exit 1
          fi

          if [[ "$("$APKANALYZER" manifest debuggable "$CANARY_APK_PATH")" != "false" ]]; then
            echo "Canary APK must be non-debuggable."
            exit 1
          fi

      - name: Prepare Canary artifact
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          CANARY_APK_NAME="Guiyuan-${VERSION_NAME}-HyperOS-${BUILD_ID}-canary.apk"
          mkdir -p dist
          cp "$CANARY_APK_PATH" "dist/$CANARY_APK_NAME"
          echo "CANARY_APK_NAME=$CANARY_APK_NAME" >> "$GITHUB_ENV"

      - name: Upload Canary APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANARY_APK_NAME }}
          path: dist/${{ env.CANARY_APK_NAME }}
          if-no-files-found: error

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          echo "### Work-branch Canary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source branch: $TRUSTED_SOURCE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $TRUSTED_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: independent exact-SHA Canary validation" >> "$GITHUB_STEP_SUMMARY"
