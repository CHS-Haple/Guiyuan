name: Release

on:
  push:
    branches: [ main ]
    paths:
      - gradle.properties
      - .github/workflows/release.yml
      - .github/actions/miuix-source/**
      - app/src/**
      - app/build.gradle.kts
      - settings.gradle.kts
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: test
        type: choice
        options:
          - test
          - stable
      publish:
        description: Publish a GitHub Release after validating signed APKs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build matched source without signing credentials
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.identity.outputs.version_name }}
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "version_name=$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "build_id=$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Checkout accepted MIUIX source
        uses: ./.github/actions/miuix-source

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up trusted main source-build Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # This job executes reviewed main source with no Haple signing credentials.
          # The separate signing runner never restores or executes Gradle cache.
          cache-provider: enhanced
          # Only a reviewed main push seeds reusable cache; manual dispatch is read-only.
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Test and assemble source-matched unsigned Internal and Release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MIUIX_SOURCE_DIR" && test -n "$MIUIX_SOURCE_REVISION"
          ./gradlew \
            -Pgy.os4.miuixDir="$MIUIX_SOURCE_DIR" \
            -Pgy.os4.miuixRevision="$MIUIX_SOURCE_REVISION" \
            -Pgy.os4.dialogSurfaces=true \
            :app:testDebugUnitTest :app:assembleInternal :app:assembleRelease \
            --no-daemon --max-workers=2 --stacktrace
          internal="app/build/outputs/apk/internal/app-internal-unsigned.apk"
          release="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$internal" && test -s "$release"
          bash tools/verify_xposed_metadata.sh "$internal" "$release"

      - name: Transfer unsigned outputs across signing boundary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-main-${{ github.sha }}
          path: |
            app/build/outputs/apk/internal/app-internal-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and verify main IT / Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
      BUILD_ID: ${{ needs.build.outputs.build_id }}
    steps:
      - name: Checkout only trusted main release metadata and signing helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/setup_haple_signing.sh
            gradle.properties
            CHANGELOG.md

      - name: Download unsigned inputs as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-main-${{ github.sha }}
          path: candidate

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install signing and manifest build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "build-tools;37.0.0"

      - name: Verify trusted signing key
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: bash tools/setup_haple_signing.sh

      - name: Sign and verify both distribution channels
        shell: bash
        env:
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: |
          set -euo pipefail
          test -n "$VERSION_NAME" && test -n "$BUILD_ID"
          test "$VERSION_NAME" = "$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          test "$BUILD_ID" = "$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          signer="$SDK_ROOT/build-tools/37.0.0/apksigner"
          mkdir -p dist
          for channel in internal release; do
            source="candidate/${channel}/app-${channel}-unsigned.apk"
            test -s "$source"
            apk="dist/Guiyuan-${VERSION_NAME}-HyperOS-${BUILD_ID}-${channel}.apk"
            "$signer" sign \
              --ks "$HAPLE_KEYSTORE_PATH" --ks-key-alias "$HAPLE_KEY_ALIAS" \
              --ks-pass env:HAPLE_KEYSTORE_PASSWORD --key-pass env:HAPLE_KEYSTORE_PASSWORD \
              --out "$apk" "$source"
            "$signer" verify --verbose --print-certs "$apk"
            cert="$("$signer" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')"
            test "$cert" = "$HAPLE_CERT_SHA256"
            badging="$("$SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$apk")"
            package="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)"
            version="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)"
            test "$package" = com.chaners.guiyuan
            expected_version="$VERSION_NAME"
            if [[ "$channel" == internal ]]; then expected_version="${VERSION_NAME}-internal"; fi
            test "$version" = "$expected_version"
            APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
            test "$("$APKANALYZER" manifest debuggable "$apk")" = false
            echo "Signed $channel / main SHA $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            sha256sum "$apk" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "INTERNAL_APK_NAME=Guiyuan-${VERSION_NAME}-HyperOS-${BUILD_ID}-internal.apk" >> "$GITHUB_ENV"
          echo "APK_NAME=Guiyuan-${VERSION_NAME}-HyperOS-${BUILD_ID}-release.apk" >> "$GITHUB_ENV"

      - name: Validate stable release boundary
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          version = os.environ["VERSION_NAME"]
          if not version.split(".", 1)[0].isdigit() or int(version.split(".", 1)[0]) < 1:
              raise SystemExit("Stable releases require version >= 1.0.0; use test for pre-1.0.")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}$", changelog, re.M)
          if not match:
              raise SystemExit("A dated and substantive version-specific CHANGELOG section is required.")
          remainder = changelog[match.end():]
          section = remainder.split("\n## [", 1)[0].strip()
          user_notes = re.sub(r"^### Engineering\s*\n.*?(?=^### |\Z)", "", section, flags=re.M | re.S).strip()
          if not user_notes:
              raise SystemExit("User-facing stable release notes are required.")
          pathlib.Path("release-notes.md").write_text(user_notes + "\n", encoding="utf-8")
          PY

      - name: Upload signed Internal IT
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.INTERNAL_APK_NAME }}
          path: dist/${{ env.INTERNAL_APK_NAME }}
          if-no-files-found: error

      - name: Upload signed Release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish explicit test prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.channel == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${BUILD_ID}-ci${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "dist/$APK_NAME" \
            --target "$GITHUB_SHA" --title "Guiyuan ${VERSION_NAME} (${BUILD_ID})" \
            --notes "Signed MIUIX source-matched release candidate from ${GITHUB_SHA}." --prerelease

      - name: Publish explicit stable release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Stable release tag already exists; promote a new versionName."
            exit 1
          fi
          gh release create "$tag" "dist/$APK_NAME" \
            --target "$GITHUB_SHA" --title "Guiyuan $VERSION_NAME" --notes-file release-notes.md
