name: Work Branch APK
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('{0} | B{1} {2}', inputs.source_branch, inputs.build_number, inputs.variant)
      || (github.event.issue.pull_request != null
          && github.actor == github.repository_owner
          && (github.event.comment.body == '/canary'
              || (startsWith(github.event.comment.body, 'B')
                  && endsWith(github.event.comment.body, ' Canary')))
          && format('{0} | {1} #{2}', github.event.issue.title,
              github.event.comment.body, github.event.issue.number))
      || format('Skipped comment | #{0}', github.event.issue.number) }}

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Trusted same-repository feat/*, fix/*, refactor/* or hotfix/* branch to validate'
        required: true
        type: string
      variant:
        description: APK variant
        required: true
        default: canary
        type: choice
        options:
          - canary
      build_number:
        description: 'Build suffix (for example 850); checked against the source Gradle Build'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: read
  packages: read
  pull-requests: read

jobs:
  build:
    # Only eligible build jobs enter the cancellation group.
    concurrency:
      group: work-apk-${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.event.issue.number }}
      cancel-in-progress: true
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.body == '/canary' ||
        (startsWith(github.event.comment.body, 'B') &&
         endsWith(github.event.comment.body, ' Canary'))) &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version_name: ${{ steps.identity.outputs.version_name }}
      build_id: ${{ steps.identity.outputs.build_id }}

    steps:
      - name: Resolve trusted source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_BRANCH: ${{ inputs.source_branch }}
          MANUAL_VARIANT: ${{ inputs.variant }}
          MANUAL_BUILD_NUMBER: ${{ inputs.build_number }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail


          case "$EVENT_NAME" in
            workflow_dispatch)
              branch="$MANUAL_SOURCE_BRANCH"
              variant="$MANUAL_VARIANT"
              expected_build="$MANUAL_BUILD_NUMBER"
              if [[ "$branch" != feat/* && "$branch" != fix/* && "$branch" != refactor/* && "$branch" != hotfix/* ]]; then
                echo "::error::Manual APK source must be a feat/*, fix/*, refactor/* or hotfix/* branch, got: $branch"
                exit 1
              fi
              if [[ "$variant" != "canary" ]]; then
                echo "::error::Unsupported APK variant: $variant"
                exit 1
              fi
              source_sha="$(
                git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$branch" |
                  awk 'NR == 1 { print $1 }'
              )"
              if [[ -z "$source_sha" ]]; then
                echo "::error::Requested source branch does not exist in this repository: $branch"
                exit 1
              fi
              ;;
            issue_comment)
              pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$COMMENT_PR_NUMBER")"
              pr_state="$(jq -r '.state' <<<"$pr_json")"
              head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
              branch="$(jq -r '.head.ref // empty' <<<"$pr_json")"
              source_sha="$(jq -r '.head.sha // empty' <<<"$pr_json")"
              case "$COMMENT_BODY" in
                /canary) variant="canary"; expected_build="" ;;
                *)
                  if [[ "$COMMENT_BODY" =~ ^B([0-9]+)[[:space:]]Canary$ ]]; then
                    expected_build="${BASH_REMATCH[1]}"
                    variant="canary"
                  else
                    echo "::error::Unsupported PR build command."
                    exit 1
                  fi
                  ;;
              esac

              if [[ "$pr_state" != "open" ]]; then
                echo "::error::Comment-triggered Canary requires an open pull request."
                exit 1
              fi
              if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
                echo "::error::Comment-triggered Canary accepts same-repository pull requests only."
                exit 1
              fi

              ;;

            *)
              echo "::error::Unsupported trigger: $EVENT_NAME"
              exit 1
              ;;
          esac

          if [[ "$branch" != feat/* && "$branch" != fix/* && "$branch" != refactor/* && "$branch" != hotfix/* ]]; then
            echo "::error::APK source must be a feat/*, fix/*, refactor/* or hotfix/* branch, got: $branch"
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a valid source SHA."
            exit 1
          fi

          if [[ -n "$expected_build" && ! "$expected_build" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Build number must be a positive integer."
            exit 1
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "expected_build=$expected_build" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' "### Trusted source"
            printf '%s\n' "- Trigger: \`$EVENT_NAME\`"
            printf '%s\n' "- Source branch: \`$branch\`"
            printf '%s\n' "- Resolved SHA: \`$source_sha\`"
            printf '%s\n' "- APK variant: \`$variant\`"
            printf '%s\n' "- Validation: this workflow independently tests and builds the exact resolved source SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout tested work-branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          EXPECTED_VARIANT: ${{ steps.source.outputs.variant }}
          EXPECTED_BUILD: ${{ steps.source.outputs.expected_build }}
        run: |
          set -euo pipefail
          resolved_sha="$(git rev-parse HEAD)"
          if [[ "$resolved_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Checked-out SHA does not match the resolved trusted source."
            exit 1
          fi
          if [[ -n "$EXPECTED_BUILD" ]]; then
            build_id="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
            if [[ "$build_id" != *-"$EXPECTED_BUILD" ]]; then
              echo "::error::Requested B$EXPECTED_BUILD does not match source Build $build_id."
              exit 1
            fi
          fi
          echo "TRUSTED_SOURCE_SHA=$resolved_sha" >> "$GITHUB_ENV"
          echo "TRUSTED_SOURCE_BRANCH=$EXPECTED_SOURCE_BRANCH" >> "$GITHUB_ENV"
          echo "APK_VARIANT=$EXPECTED_VARIANT" >> "$GITHUB_ENV"

      - name: Checkout accepted MIUIX source
        uses: ./.github/actions/miuix-source

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Verify pinned HyperOS target profile
        run: python3 tools/verify_target_profile.py

      - name: Test and build requested APK
        shell: bash
        run: |
          case "$APK_VARIANT" in
            canary) ASSEMBLE_TASK=":app:assembleCanary" ;;
            *)
              echo "::error::Unsupported APK variant: $APK_VARIANT"
              exit 1
              ;;
          esac
          test -n "$MIUIX_SOURCE_REVISION" && test -n "$MIUIX_SOURCE_DIR"
          ./gradlew \
            -Pgy.os4.miuixDir="$MIUIX_SOURCE_DIR" \
            -Pgy.os4.miuixRevision="$MIUIX_SOURCE_REVISION" \
            -Pgy.os4.dialogSurfaces=true \
            :app:testDebugUnitTest "$ASSEMBLE_TASK" --stacktrace

      - name: Resolve built APK
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/$APK_VARIANT"
          if [[ -f "$APK_DIR/app-$APK_VARIANT-unsigned.apk" ]]; then
            APK_PATH="$APK_DIR/app-$APK_VARIANT-unsigned.apk"
          else
            echo "$APK_VARIANT APK output was not found."
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Verify modern Xposed metadata
        shell: bash
        run: bash tools/verify_xposed_metadata.sh "$APK_PATH"

      - name: Verify APK is non-debuggable
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          if [[ -z "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found."
            exit 1
          fi

          if [[ "$("$APKANALYZER" manifest debuggable "$APK_PATH")" != "false" ]]; then
            echo "$APK_VARIANT APK must be non-debuggable."
            exit 1
          fi

      - name: Record exact source Build identity
        id: identity
        shell: bash
        run: |
          echo "version_name=$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "build_id=$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Pass unsigned Canary to isolated signer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-work-${{ steps.source.outputs.sha }}
          path: app/build/outputs/apk/canary/app-canary-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          echo "### Work-branch APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source branch: $TRUSTED_SOURCE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $TRUSTED_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variant: $APK_VARIANT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: independent exact-SHA APK validation; MIUIX source $MIUIX_SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: Signed work-branch Canary
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main signing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/setup_haple_signing.sh

      - name: Fetch unsigned candidate only as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-work-${{ needs.build.outputs.source_sha }}
          path: candidate

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install signing build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "build-tools;37.0.0"

      - name: Restore and verify signing identity
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: bash tools/setup_haple_signing.sh

      - name: Sign exact reviewed Canary bytes and verify identity
        shell: bash
        env:
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          source="candidate/app-canary-unsigned.apk"
          test -s "$source" && test -n "$SOURCE_SHA" && test -n "$VERSION_NAME" && test -n "$BUILD_ID"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          signer="$SDK_ROOT/build-tools/37.0.0/apksigner"
          mkdir -p dist
          apk="dist/Guiyuan-${VERSION_NAME}-HyperOS-${BUILD_ID}-canary.apk"
          "$signer" sign --ks "$HAPLE_KEYSTORE_PATH" --ks-key-alias "$HAPLE_KEY_ALIAS" \
            --ks-pass env:HAPLE_KEYSTORE_PASSWORD --key-pass env:HAPLE_KEYSTORE_PASSWORD \
            --out "$apk" "$source"
          "$signer" verify --verbose --print-certs "$apk"
          cert="$("$signer" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "$HAPLE_CERT_SHA256"
          badging="$("$SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$apk")"
          test "$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)" = com.chaners.guiyuan
          test "$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)" = "$VERSION_NAME"
          echo "APK_NAME=$(basename "$apk")" >> "$GITHUB_ENV"
          echo "Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed Canary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
