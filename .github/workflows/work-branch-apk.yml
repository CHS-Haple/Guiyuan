name: Work Branch APK
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('{0} | B{1} {2}', inputs.source_branch, inputs.build_number, inputs.variant)
      || (github.event.issue.pull_request != null
          && github.actor == github.repository_owner
          && (github.event.comment.body == '/canary'
              || (startsWith(github.event.comment.body, 'B')
                  && (endsWith(github.event.comment.body, ' Canary') ||
                      endsWith(github.event.comment.body, ' Diagnostic'))))
          && format('{0} | {1} #{2}', github.event.issue.title,
              github.event.comment.body, github.event.issue.number))
      || format('Skipped comment | #{0}', github.event.issue.number) }}

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Reviewed work Canary or protected IT Canary/diagnostic candidate'
        required: true
        type: string
      variant:
        description: APK variant
        required: true
        default: canary
        type: choice
        options:
          - canary
          - diagnostic
      build_number:
        description: 'Build suffix (for example 850); checked against the source Gradle Build'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: read
  packages: read
  pull-requests: read

jobs:
  build:
    # Only eligible build jobs enter the cancellation group.
    concurrency:
      group: work-apk-${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.event.issue.number }}
      cancel-in-progress: true
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.body == '/canary' ||
        (startsWith(github.event.comment.body, 'B') &&
         (endsWith(github.event.comment.body, ' Canary') ||
          endsWith(github.event.comment.body, ' Diagnostic')))) &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version_name: ${{ steps.identity.outputs.version_name }}
      version_code: ${{ steps.identity.outputs.version_code }}
      build_id: ${{ steps.identity.outputs.build_id }}
      candidate_run_id: ${{ steps.identity.outputs.candidate_run_id }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      variant: ${{ steps.source.outputs.variant }}

    steps:
      - name: Resolve trusted source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_BRANCH: ${{ inputs.source_branch }}
          MANUAL_VARIANT: ${{ inputs.variant }}
          MANUAL_BUILD_NUMBER: ${{ inputs.build_number }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail


          case "$EVENT_NAME" in
            workflow_dispatch)
              branch="$MANUAL_SOURCE_BRANCH"
              variant="$MANUAL_VARIANT"
              expected_build="$MANUAL_BUILD_NUMBER"
              if [[ ( "$variant" != "canary" && "$variant" != "diagnostic" ) ||
                    ( "$branch" != "it" && "$branch" != feat/* && "$branch" != fix/* && "$branch" != refactor/* && "$branch" != hotfix/* ) ||
                    ( "$variant" == "diagnostic" && "$branch" != "it" ) ]]; then
                echo "::error::Diagnostic candidate requires protected IT and owner dispatch."
                exit 1
              fi
              source_sha="$(
                git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$branch" |
                  awk 'NR == 1 { print $1 }'
              )"
              if [[ -z "$source_sha" ]]; then
                echo "::error::Requested source branch does not exist in this repository: $branch"
                exit 1
              fi
              ;;
            issue_comment)
              pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$COMMENT_PR_NUMBER")"
              pr_state="$(jq -r '.state' <<<"$pr_json")"
              head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
              branch="$(jq -r '.head.ref // empty' <<<"$pr_json")"
              source_sha="$(jq -r '.head.sha // empty' <<<"$pr_json")"
              if [[ "$COMMENT_BODY" =~ ^B([0-9]+)[[:space:]]Diagnostic$ ]]; then
                expected_build="${BASH_REMATCH[1]}"
                variant="diagnostic"
                branch_json="$(gh api "repos/$GITHUB_REPOSITORY/branches/it")"
                test "$(jq -r '.protected' <<< "$branch_json")" = true
                source_sha="$(jq -r '.commit.sha' <<< "$branch_json")"
                # The comment author must own the repository; only the just-merged
                # protected IT PR may authorize this exact diagnostic candidate.
                test "$(jq -r '.merged' <<< "$pr_json")" = true
                test "$(jq -r '.base.ref' <<< "$pr_json")" = it
                test "$(jq -r '.merge_commit_sha' <<< "$pr_json")" = "$source_sha"
                test "$head_repo" = "$GITHUB_REPOSITORY"
                branch="it"
              else
                case "$COMMENT_BODY" in
                  /canary) variant="canary"; expected_build="" ;;
                  *)
                    if [[ "$COMMENT_BODY" =~ ^B([0-9]+)[[:space:]]Canary$ ]]; then
                      expected_build="${BASH_REMATCH[1]}"
                      variant="canary"
                    else
                      echo "::error::Unsupported PR build command."
                      exit 1
                    fi
                    ;;
                esac
                if [[ "$pr_state" != "open" || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
                  echo "::error::Canary comments require an open same-repository PR."
                  exit 1
                fi
              fi

              ;;

            *)
              echo "::error::Unsupported trigger: $EVENT_NAME"
              exit 1
              ;;
          esac

          if [[ ( "$variant" != "canary" && "$variant" != "diagnostic" ) ||
                ( "$branch" != "it" && "$branch" != feat/* && "$branch" != fix/* && "$branch" != refactor/* && "$branch" != hotfix/* ) ||
                ( "$variant" == "diagnostic" && "$branch" != "it" ) ]]; then
            echo "::error::Diagnostic signing is owner-only from protected it."
            exit 1
          fi
          if [[ "$branch" == "it" && "$EVENT_NAME" != "workflow_dispatch" && "$variant" != "diagnostic" ]]; then
            echo "::error::Protected IT Canary requires owner-triggered dispatch."
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a valid source SHA."
            exit 1
          fi

          if [[ -n "$expected_build" && ! "$expected_build" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Build number must be a positive integer."
            exit 1
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "expected_build=$expected_build" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' "### Trusted source"
            printf '%s\n' "- Trigger: \`$EVENT_NAME\`"
            printf '%s\n' "- Source branch: \`$branch\`"
            printf '%s\n' "- Resolved SHA: \`$source_sha\`"
            printf '%s\n' "- APK variant: \`$variant\`"
            printf '%s\n' "- Validation: this workflow signs only a successful exact-SHA Build artifact; no mutable source executes here"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require an accepted matching PR and a successful exact-SHA Build
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          EXPECTED_BUILD: ${{ steps.source.outputs.expected_build }}
        run: |
          set -euo pipefail
          # Never check out or execute the selected PR's source on this default-branch runner.
          test "$SOURCE_SHA" != "" && [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$SOURCE_BRANCH" == "it" ]]; then
            branch_json="$(gh api "repos/$GITHUB_REPOSITORY/branches/it")"
            test "$(jq -r '.protected' <<< "$branch_json")" = "true"
            test "$(jq -r '.commit.sha' <<< "$branch_json")" = "$SOURCE_SHA"
            if [[ "${{ steps.source.outputs.variant }}" == "diagnostic" ]]; then
              artifact="unsigned-it-diagnostic-$SOURCE_SHA"
            else
              artifact="unsigned-it-canary-$SOURCE_SHA"
            fi
            event="push"
            pr_number=""
          else
            test "${{ steps.source.outputs.variant }}" = "canary"
            prs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100")"
            pr_number="$(jq -r \
              --arg repo "$GITHUB_REPOSITORY" --arg branch "$SOURCE_BRANCH" --arg sha "$SOURCE_SHA" \
              '.[] | select(.head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $sha and .draft == false) | .number' \
              <<< "$prs" | head -n 1)"
            if [[ -z "$pr_number" ]]; then
              echo "::error::Canary requires an open same-repository PR at the requested exact SHA."
              exit 1
            fi
            artifact="unsigned-pr-canary-$SOURCE_SHA"
            event="pull_request"
          fi

          # Gradle properties are read as inert GitHub API data, never sourced or executed.
          props="$(gh api "repos/$GITHUB_REPOSITORY/contents/gradle.properties?ref=$SOURCE_SHA" \
            --jq '.content' | base64 -d)"
          version="$(sed -n 's/^combinedStatus.versionName=//p' <<< "$props")"
          build="$(sed -n 's/^combinedStatus.buildId=//p' <<< "$props")"
          version_code="$(sed -n 's/^combinedStatus.versionCode=//p' <<< "$props")"
          [[ "$version_code" =~ ^[1-9][0-9]+$ ]]
          it_suffix="$(sed -n 's/^combinedStatus.itVersionSuffix=//p' <<< "$props")"
          # Only the IT-owned source may opt into a visible IT version suffix.
          if [[ -n "$it_suffix" ]]; then
            if [[ "$it_suffix" != "-IT" ]]; then
              echo "::error::Unsupported version suffix from source."
              exit 1
            fi
            if [[ "$SOURCE_BRANCH" != "it" ]]; then
              base_branch="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.base.ref')"
              if [[ "$base_branch" != "it" ]]; then
                echo "::error::IT version suffix requires a PR targeting protected it."
                exit 1
              fi
            fi
            marker_type="$(gh api "repos/$GITHUB_REPOSITORY/contents/it-only/RESTRICT_PROJECT_LINK?ref=$SOURCE_SHA" --jq '.type')"
            test "$marker_type" = "file"
            version="$version$it_suffix"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([._-][A-Za-z0-9]+)*$ ]] &&
            [[ "$build" =~ ^[0-9]{8}-[0-9]+$ ]]
          if [[ -n "$EXPECTED_BUILD" && "$build" != *-"$EXPECTED_BUILD" ]]; then
            echo "::error::Requested B$EXPECTED_BUILD does not match source Build $build."
            exit 1
          fi

          runs="$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=$event&head_sha=$SOURCE_SHA&per_page=100")"
          run_id="$(jq -r --arg sha "$SOURCE_SHA" --arg branch "$SOURCE_BRANCH" --arg event "$event" \
            '.workflow_runs | map(select(.head_sha == $sha and .head_branch == $branch and .event == $event and .status == "completed" and .conclusion == "success")) | max_by(.run_number) | .id // empty' \
            <<< "$runs")"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful exact-SHA $event Build was found for $SOURCE_BRANCH."
            exit 1
          fi
          list="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          if ! jq -e --arg name "$artifact" '.artifacts | any(.name == $name and .expired == false)' \
            <<< "$list" >/dev/null; then
            echo "::error::Verified Build $run_id has no nonexpired exact-SHA artifact $artifact."
            exit 1
          fi
          {
            echo "version_name=$version"
            echo "version_code=$version_code"
            echo "build_id=$build"
            echo "candidate_run_id=$run_id"
            echo "artifact_name=$artifact"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Signed APK admission"
            if [[ "$SOURCE_BRANCH" == "it" ]]; then
              echo "- Source: protected IT branch"
            else
              echo "- PR: #$pr_number"
            fi
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Trusted successful PR Build: $run_id"
            echo "- Build: $build"
            echo "- Selected artifact: $artifact"
            echo "- No PR source was executed in the default-branch workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: Sign reviewed Canary / protected IT diagnostic
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted main signing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/setup_haple_signing.sh

      - name: Fetch unsigned candidate only as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: candidate
          run-id: ${{ needs.build.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install signing build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "build-tools;37.0.0"

      - name: Restore and verify signing identity
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: bash tools/setup_haple_signing.sh

      - name: Sign reviewed candidate and verify identity
        shell: bash
        env:
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          VARIANT: ${{ needs.build.outputs.variant }}
        run: |
          set -euo pipefail
          [[ "$VARIANT" == "canary" || "$VARIANT" == "diagnostic" ]]
          if [[ "$VARIANT" == "diagnostic" ]]; then
            source="candidate/app-itDiagnostic-unsigned.apk"
          else
            source="candidate/app-canary-unsigned.apk"
          fi
          test -s "$source" && test -n "$SOURCE_SHA" && test -n "$VERSION_NAME" && test -n "$BUILD_ID"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          signer="$SDK_ROOT/build-tools/37.0.0/apksigner"
          mkdir -p dist
          apk="dist/Guiyuan-${VERSION_NAME}-HyperOS-${BUILD_ID}-${VARIANT}.apk"
          "$signer" sign --ks "$HAPLE_KEYSTORE_PATH" --ks-key-alias "$HAPLE_KEY_ALIAS" \
            --ks-pass env:HAPLE_KEYSTORE_PASSWORD --key-pass env:HAPLE_KEYSTORE_PASSWORD \
            --out "$apk" "$source"
          "$signer" verify --verbose --print-certs "$apk"
          cert="$("$signer" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "$HAPLE_CERT_SHA256"
          badging="$("$SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$apk")"
          test "$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)" = com.chaners.guiyuan
          test "$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)" = "$VERSION_NAME"
          test "$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$badging" | head -n 1)" = "$VERSION_CODE"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test "$("$APKANALYZER" manifest debuggable "$apk")" = false
          echo "APK_NAME=$(basename "$apk")" >> "$GITHUB_ENV"
          echo "Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed reviewed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: ${{ needs.build.outputs.variant == 'diagnostic' && 2 || 3 }}
