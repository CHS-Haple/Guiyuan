name: Feature request / 功能建议
description: Suggest a feature or improvement / 提出功能或体验改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe what you'd like. No technical solution needed.
        说说希望归元怎么改，不需要提供技术方案。
  - type: textarea
    id: request
    attributes:
      label: What would you like? / 希望增加或改进什么？
      placeholder: "I'd like Guiyuan to ... / 我希望归元能够……"
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case (optional) / 使用场景（选填）
  - type: textarea
    id: references
    attributes:
      label: Examples or screenshots (optional) / 参考或截图（选填）
