name: Feature request
description: Propose a new capability or behavior
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are evaluated against Guiyuan's architecture, maintainability, and fail-native safety principles. A proposed mechanism may be adjusted or rejected when a safer native integration exists.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe what should happen from the user's perspective.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Primary scope
      options:
        - Home status bar
        - Notification shade
        - Control Center
        - Lock screen / Keyguard
        - AOD
        - Charging
        - Network / SIM behavior
        - Companion app
        - Diagnostics / developer tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Runtime evidence or references
      description: Optional. Include SystemUI behavior, screenshots, recordings, or other technical context when they materially help explain the request.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention simpler or more native approaches you have considered.
