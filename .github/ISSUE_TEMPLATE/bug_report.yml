name: Bug report / 问题反馈
description: Report a problem with Guiyuan / 反馈归元使用问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe what happened. Steps or screenshots help, but are optional.
        请说明遇到的问题。复现步骤、截图可选，有助于排查。

        Remove private information before uploading files. / 上传文件前请去除隐私信息。
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 出现了什么问题？
      placeholder: "For example: After switching ..., ... / 例如：切换……后，出现……"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (if known) / 复现方法（如有）
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: build
    attributes:
      label: Guiyuan version / 归元版本
      placeholder: "1.0.0 / B1733"
  - type: input
    id: device
    attributes:
      label: Device and system / 设备与系统
      placeholder: "Xiaomi 15 Pro / HyperOS 4 / SystemUI ..."
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs (optional) / 截图或日志（选填）
